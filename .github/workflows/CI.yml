name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run cargo tests
        run: |
          cargo test --all --all-targets --verbose

  python-tests:
    name: Python tests (maturin + pytest)
    runs-on: ubuntu-latest
    needs: rust-tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv and install deps
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          if [ -f python/requirements-dev.txt ]; then
            ./.venv/bin/pip install -r python/requirements-dev.txt
          else
            ./.venv/bin/pip install maturin pytest numpy
          fi

      - name: Build & install extension into venv (maturin develop)
        # maturin détecte .venv à la racine sans besoin d’activation
        run: |
          maturin develop -m python/pyproject.toml --release

      - name: Run pytest
        run: |
          ./.venv/bin/pytest -q python/fink_fat/tests
