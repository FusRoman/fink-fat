name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run cargo tests
        run: |
          cargo test --all --all-targets --verbose

  python-tests:
    name: Python tests (maturin + pytest)
    runs-on: ubuntu-latest
    needs: rust-tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv (.venv)
        run: |
          python -m venv .venv
          ./.venv/bin/python -V

      - name: Upgrade pip & install test deps (in .venv)
        run: |
          ./.venv/bin/python -m pip install --upgrade pip wheel setuptools
          ./.venv/bin/pip install pytest pytest-cov maturin

      - name: Build and develop-install the extension (maturin)
        run: |
          ./.venv/bin/maturin develop --release

      - name: Show installed package info
        run: |
          ./.venv/bin/python -c "import sys; print('Python:', sys.version)"
          ./.venv/bin/python -c "import fink_fat as m; print('fink_fat:', getattr(m,'__version__','unknown')); print('from:', m.__file__)"

      - name: Run pytest
        run: |
          ./.venv/bin/pytest -q --maxfail=1 --disable-warnings -ra
