name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run cargo tests
        run: |
          cargo test --all --all-targets --verbose

  python-tests:
    name: Python tests (maturin + pytest)
    runs-on: ubuntu-latest
    needs: rust-tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('python/**/requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # si tu as un requirements-dev.txt, on l'utilise ; sinon on installe un minimum vital
          if [ -f python/requirements-dev.txt ]; then
            pip install -r python/requirements-dev.txt
          else
            pip install maturin pytest numpy
          fi

      - name: Build & install extension in editable env (maturin develop)
        # Important: on pointe sur le pyproject du dossier python/
        run: |
          maturin develop -m python/pyproject.toml --release

      - name: Run pytest
        run: |
          pytest -q python/fink_fat/tests
