name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        # Note: Needed for plotters in the fink-fat-eval crate
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        # Note: Needed for plotters in the fink-fat-eval crate
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo check
        run: cargo check --all-targets --all-features

  sql-integration-test:
    name: SQL conversion integration test
    runs-on: ubuntu-latest
    needs: [check]
    # Throwaway instance for `tests/sql_convert.rs`, which exercises the real
    # `fink-fat convert --format sql` path against Postgres (COPY BINARY,
    # UNLOGGED tables, deferred FK/index rebuild) — behaviour with no SQLite
    # equivalent, so this test needs a real Postgres rather than a lighter
    # stand-in. Same credentials as the repo's `docker-compose.yml` `db`
    # service, so `DATABASE_URL` below matches what a contributor would use
    # locally.
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: finkfat
          POSTGRES_PASSWORD: finkfat
          POSTGRES_DB: finkfat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        # Note: Needed for plotters in the fink-fat-eval crate
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo test --test sql_convert
        env:
          DATABASE_URL: postgres://finkfat:finkfat@localhost:5432/finkfat_test
        run: cargo test -p fink-fat --test sql_convert

  doc:
    name: Documentation check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        # Note: Needed for plotters in the fink-fat-eval crate
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: [fmt, clippy, check, doc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Generate coverage (engine only, lcov)
        env:
          RAYON_NUM_THREADS: 2
          RUST_TEST_THREADS: 1
        run: |
          cargo llvm-cov \
            --package fink-fat-engine \
            --all-features \
            --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
