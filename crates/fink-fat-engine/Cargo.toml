[package]
name = "fink-fat-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
license-file.workspace = true
readme = "README.md"

[dependencies]
rand = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
camino = { workspace = true }
tracing = { workspace = true }
ahash = { workspace = true }
arrow-array = "57.3.0"
bitcode = { version = "0.6.9", features = ["serde"] }
cdshealpix = "0.7.3"
chrono = "0.4.42"
config = "0.15.19"
datafusion = { version = "52.1.0" }
object_store = { version = "=0.12.5", features = ["http"] }
hdfs-native-object-store = "0.15.0"
ndarray = { workspace = true }
once_cell = "1.21.3"
ort = { version = "2.0.0-rc.11", features = ["ndarray"] }
outfit = { version = "2.1.0", features = ["parallel", "jpl-download"] }
rayon = "1.11.0"
serde_json = "1.0.145"
zstd = { version = "0.13", default-features = false }
lz4_flex = { version = "0.11", default-features = false, features = ["frame"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
smallvec = "1.15.1"
thread_local = "1.1.9"
url = "2.5.8"
tokio = { version = "=1.49.0", features = ["rt-multi-thread"] }

[dev-dependencies]
approx = "0.5.1"
criterion = "0.8.1"
proptest = "1.9.0"
serde_yaml = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "generate_topk_edges"
harness = false
