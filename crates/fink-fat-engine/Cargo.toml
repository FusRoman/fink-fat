[package]
name = "fink-fat-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = { version = "0.8.12", features = ["serde"] }
bitcode = { version = "0.6.9", features = ["serde"] }
camino = "1.2.1"
cdshealpix = "0.7.3"
chrono = "0.4.42"
config = "0.15.19"
ndarray = "0.17.2"
once_cell = "1.21.3"
ort = { version = "2.0.0-rc.11", features = ["ndarray"] }
rayon = "1.11.0"
serde = "1.0.228"
serde_json = "1.0.145"
smallvec = "1.15.1"
thiserror = "2.0.17"
thread_local = "1.1.9"

[dev-dependencies]
approx = "0.5.1"
criterion = "0.8.1"
proptest = "1.9.0"
rand = "0.9.2"
serde_yaml = "0.9.34"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true

[[bench]]
name = "generate_topk_edges"
harness = false
