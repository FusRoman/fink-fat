[package]
name = "fink-fat-ades"
description = "Pure ADES/MPC domain logic (document building, local schema validation, submission request/response parsing, submission-quality tiering) shared by the fink-fat CLI and fink-fat-explorer."
edition.workspace = true
version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
license-file.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = "1.0"
serde_yaml = { workspace = true }
thiserror = { workspace = true }
quick-xml = { version = "0.37", features = ["serialize"] }
hifitime = { version = "4.3", default-features = false, features = ["std"] }
chrono = { workspace = true, features = ["serde"] }
