[project]
name = "edge_machine_learning"
version = "0.1.0"
description = "Default template for PDM package"
authors = [{ name = "Roman", email = "roman.lemontagner@gmail.com" }]
dependencies = [
    "pandas>=3.0.0",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "pyarrow>=23.0.0",
    "xgboost>=3.1.3",
    "pyyaml>=6.0.3",
    "skl2onnx>=1.17.0",
    "onnxmltools>=1.16.0",
]
requires-python = "==3.12.*"
readme = "README.md"
license = { text = "MIT" }


[tool.pdm]
distribution = false

[dependency-groups]
dev = ["black>=26.1.0"]
