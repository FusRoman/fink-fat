[package]
name = "fink-fat-explorer"
version = "0.1.0"
authors = ["Roman <roman.lemontagner@gmail.com>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
dotenvy = "0.15.7"
hifitime = { version = "4.3", default-features = false, features = ["std"] }
plotly = "0.14.1"
serde.workspace = true
serde_json = "1.0"

# Server-only dependencies — not compiled for wasm32.
# fink-fat-engine pulls tokio (rt-multi-thread, fs) and getrandom without
# the "js" feature, neither of which compile for wasm32-unknown-unknown.
# nalgebra is only used in the server-side orbital conversion code.
base64 = { version = "0.22", optional = true }
camino = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
fink-fat-engine = { workspace = true, optional = true }
nalgebra = { workspace = true, optional = true }
outfit = { workspace = true, optional = true }
photom = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }

sqlx = { version = "0.9.0", features = [
    "postgres",
    "runtime-tokio",
    "macros",
    "json",
    "chrono",
], optional = true }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
], optional = true }
web-sys = { version = "0.3.104", features = ["console"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = [
    "dioxus/server",
    "dep:sqlx",
    "dep:tokio",
    "dep:base64",
    "dep:camino",
    "dep:chrono",
    "dep:fink-fat-engine",
    "dep:nalgebra",
    "dep:outfit",
    "dep:photom",
    "dep:rayon",
    "dep:reqwest"
]
