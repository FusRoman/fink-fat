[workspace.package]
edition = "2024"
version = "1.0.0"
authors = ["Roman Le Montagner <roman.le-montagner@ijclab.in2p3.fr>"]
categories = ["science"]
keywords = ["astronomy", "asteroids", "tracking", "alerts"]
repository = "https://github.com/FusRoman/fink-fat"
homepage = "https://github.com/FusRoman/fink-fat"
documentation = "https://docs.rs/fink-fat"
license-file = "LICENSE"

[package]
name = "fink-fat"
readme = "README.md"
description = "FINK-FAT: Fink Asteroid Tracker, a software to track asteroids in an alert stream such as Fink's.It provides a graph-based representation of the linked alerts and implements algorithms to predict potential asteroid detections and track them over time."
edition.workspace = true
version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
license-file.workspace = true

[workspace]
members = ["crates/fink-fat-engine", "crates/fink-fat-eval"]
resolver = "2"

[workspace.dependencies]
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
ahash = { version = "0.8.12", features = ["serde"] }
thiserror = "2.0.17"
camino = "1.2.1"
tempfile = "3.23.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4.5.60", features = ["cargo", "derive"] }
chrono = "0.4"
fink-fat-engine = { path = "crates/fink-fat-engine", version = "1.0.0" }
indicatif = "0.18.0"
serde_yaml = "0.9.34"
ndarray = "0.17.2"

[dependencies]
indicatif = { workspace = true }
camino = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
fink-fat-engine = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
husky-rs = "0.1.5"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
codegen-units = 1
debug = true

[profile.evaluation]
inherits = "release"
lto = false
codegen-units = 128
overflow-checks = true
debug-assertions = true
incremental = true

[profile.evaluation.package."*"]
codegen-units = 32
overflow-checks = true
debug-assertions = true
incremental = false
