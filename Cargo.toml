[package]
name = "fink-fat"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "fink_fat"
crate-type = ["cdylib"]

[dependencies]
ahash = "0.8.12"
cdshealpix = "0.7.3"
indicatif = "0.18.0"
itertools = "0.14.0"
numpy = "0.26.0"
pyo3 = { version = "0.26", features = ["extension-module"] }

[dev-dependencies]
proptest = "1.8.0"

[profile.release]
debug = 1          # conserve les symboles
strip = "none"
lto = "thin"
codegen-units = 1
