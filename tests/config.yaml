version: 1

log_level: info
storage_path: ./storage
time_binner_width: 0.021

pairs:
  acc_prior_var: 0.0001
  allow_same_timebin: true
  max_angular_speed: "40 arcmin/day"
  max_dt: "5 hours"
  max_mag_difference: 1.6

kalman_shared_context:
  config:
    dt_ref: 1.0
    q0: 1e-12
    solver_type:
      kind: Auto
      params:
        convergency: 2.220446049250313e-14
        max_iter_prelim_kepuni: 20
        parabolic_solving_method: Cardano
        psi_guess: null
  ephem_file_name: horizon:DE440
  ut1_file_version: null

advance_params:
  branch_cap: 10
  completeness_width_mag: 0.4
  likelihood_threshold: 0.0
  limiting_magnitude: 21.0
  n_scan: 1
  obs_noise:
    - 2.35e-13
    - 2.35e-13
  quick_reject_radius_rad: "3.5 arcmin"
  radius_strategy:
    Clamped:
      inner: MixtureCovariance
      max_arcsec: "30 arcmin"
  top_k:
    WeightThreshold: 0.99
  visit_epoch_tolerance_days: 0.000011574074074074073
healpix_depth: 8

