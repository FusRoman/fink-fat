# Fink-FAT configuration (schema v1)
# All angles are in **radians**, times in **days (TT)** unless stated otherwise.
schema_version = "1"

# Whether to display progress bars during seeding/linking.
show_progress = false

[binning]
# HEALPix order (K), with NSIDE = 2^depth. Typical range: 6–12.
healpix_depth = 10
# Uniform time-bin width used for bucketing alerts (days, TT).
time_bin_width_days = 0.02

[pairs]
# --- Pair generation thresholds ---
# Maximum time gap allowed between two alerts in a pair (days, TT).
max_dt = 0.06
# Maximum on-sky angular separation between the two alerts (radians).
max_sep = 0.003
# Maximum allowed photometric mismatch (in your working photometric unit, e.g. nJy or mag-diff proxy).
# If magnitudes are used upstream, ensure this is consistent with your preprocessing.
max_flux_difference = 5.0
# If true, pairs are allowed even when both alerts fall in the same time bin.
allow_same_timebin = true

[triplets]
# --- Triplet generation thresholds ---
# Maximum time gap between consecutive edges inside a triplet (days, TT).
max_dt_between = 0.04
# Maximum pair separation used when chaining the middle alert with the two ends (radians).
max_pair_sep = 0.0025
# Hard gate on the predicted residual when extrapolating within a triplet (radians on tangent plane).
max_predicted_residual = 0.0008
# Enforce strict time ordering t_a < t_b < t_c when building triplets.
enforce_time_order = true
# Maximum allowed photometric mismatch within the triplet (same unit as in [pairs]).
max_flux_difference = 5.0

[link.predict]
# --- Inter-night prediction model (cone inflation, etc.) ---
# k-sigma inflation factor for the predicted positional uncertainty (dimensionless).
k_sigma = 3.5
# If true, inflate the spatial search cell radius by the predicted 1-sigma cone size to avoid edge losses.
pad_cell_radius = true

[link.predict.noise]
# --- Additive model-noise schedule on the plane covariance ---
# The schedule is Q(Δt) = variance_floor + drift_per_day*|Δt| + curvature_per_day2*Δt^2, with Δt in days (TT).
# Units follow your plane covariance convention (typically radians^2), per-axis.
variance_floor = 1.0e-12      # Static floor (covers residual modeling errors, jitter).
drift_per_day = 0.0          # Linear drift with time gap (set >0 to hedge long gaps).
curvature_per_day2 = 5.0e-14      # Quadratic curvature term (captures unmodeled acceleration).

[link.scoring.weights]
# --- Score weights for the gated objective (dimensionless) ---
# Larger means the term contributes more to the final score.
w_pos = 0.5         # Position (Mahalanobis) consistency.
w_vel_dir = 0.3     # Velocity direction consistency.
w_vel_norm = 0.3    # Speed (norm) consistency.
w_flux = 0.5        # Photometric consistency.
w_gap = 0.3         # Penalty for Δ>1 revisit gaps.
w_band_mismatch = 0.2  # Penalty for cross-band associations (if applicable).

[link.scoring.gates]
# --- Hard gates (pre-score pruning) ---
# Max allowed Mahalanobis distance squared for position residuals (dimensionless).
max_d2_pos = 12.0
# Max allowed difference in velocity direction (radians).
max_theta_vel = 0.17453292519943295   # 10 deg in radians
# Max allowed difference in speed (radians/day). Use a very large value to effectively disable.
max_speed_diff = 1000000000.0         # "very large" ≈ no gating

[link.scoring.scales]
# --- Soft-scale parameters used inside score terms ---
# Angular scale for direction mismatches (radians).
theta0 = 0.08726646259971647          # 5 deg in radians
# Speed scale for velocity-norm consistency (radians/day).
v0 = 0.005
# Photometric noise floor to stabilize flux-based terms (same unit as your flux features, e.g. nJy).
flux_sigma_floor = 50.0
# Gap penalty strength (dimensionless). Larger => stronger penalty for multi-revisit jumps.
gap_rho = 1.0
# Small time epsilon used in velocity differencing/regularization (days).
vel_eps_days = 0.001

[link.limits]
# --- Graph/candidate limits to bound combinatorics ---
# Keep at most this many top candidates per left node after gating.
top_k_per_left = 10
# Optional global cap on the total number of edges kept after gating (None to disable).
max_total_edges = 200000
# Optional hard cap on per-edge cost before assignment (None to disable).
max_cost = 10.0

# Minimum cost flow parameters
[link.mcf]
lambda_start = 0.5          # Initial link cost weight (dimensionless).
lambda_end = 0.5            # Final link cost weight (dimensionless).
gap_penalty_weight = 0.1   # Gap penalty weight (dimensionless).
max_revisit_gap = 3     # Max allowed revisit gap for gap penalties (in number of time bins).
max_total_flow = 1000000  # Global cap on the total flow through the network (None to disable).
horizon_nights = 5        # Number of nights in the rolling horizon.
